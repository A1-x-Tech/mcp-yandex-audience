[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-yandex-audience"
version = "0.0.1"
description = "MCP-сервер для Яндекс Аудиторий (audience.yandex.ru) — сегменты, пиксели и похожие аудитории. Для Claude, Cursor, Codex и других AI-клиентов."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "gistrec", email = "gistrec@gmail.com" }]
keywords = ["mcp", "yandex", "audience", "advertising"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/A1-x-Tech/mcp-yandex-audience"
Repository = "https://github.com/A1-x-Tech/mcp-yandex-audience"

[tool.hatch.build.targets.wheel]
packages = ["mcp_yandex_audience"]
